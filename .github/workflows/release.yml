name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Read version from tag
        if: github.ref_type == 'tag'
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)$') {
            throw "Release tags must use semantic versioning, for example v1.2.0 or v1.2.0-beta.1."
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($Matches.version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Test and publish
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $arguments = @{ Output = 'artifacts/publish' }
          if ($env:RELEASE_VERSION) {
            $arguments.Version = $env:RELEASE_VERSION
          }
          ./build/publish.ps1 @arguments

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JiraTaskBar-win-x64
          path: |
            artifacts/publish/JiraTaskBar.exe
            artifacts/publish/JiraTaskBar.exe.sha256
            artifacts/publish/LICENSE
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            artifacts/publish/JiraTaskBar.exe
            artifacts/publish/JiraTaskBar.exe.sha256
            artifacts/publish/LICENSE
